[project]
name = "analysis"
version = "0.1.0"
description = "Supporting information for: <publication title>"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.12"
# Lower bounds only; exact versions live in uv.lock.
dependencies = [
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
# Default since ruff 0.6; explicit so notebooks are never silently skipped.
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "SIM",
    "PTH",      # pathlib over os.path: portable path handling
    "PLW1514",  # open() without encoding: default differs between OSes
    "D",        # docstrings on public API
]
# PLW1514 is a preview rule; enable just the explicitly selected ones.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Notebooks use markdown cells, and often import after explanatory cells.
"*.ipynb" = ["E402", "D"]
# Test names document intent.
"tests/**" = ["D"]
