name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      # Binder can't read uv.lock; fail if its exported copy drifts.
      - run: |
          uv export --frozen --no-dev --no-hashes -o .binder/requirements.txt
          git diff --exit-code .binder/requirements.txt
      - name: Validate Zenodo metadata
        run: >
          uvx check-jsonschema
          --schemafile https://raw.githubusercontent.com/zenodo/zenodo/master/zenodo/modules/deposit/jsonschemas/deposits/records/legacyrecord.json
          .zenodo.json
